name = "Skyrim"
description = ["Khajiit has themes, if you have taste.", "Hey, you. You're finally themed.", "I used to be a software engineer like you. Then I took an AI in the knee."]
gnome_accent = "blue"
icon_color = ["blue", "nordic"]
icon_tint = 0.2
wallpaper = "wallpapers/skyrim/skyrim.jpg"

# From tui-portfolio's skyrim theme; bg_alt, card_alt, the hovers and the terminal are derived.
[colors]
bg            = "#12110f"
bg_alt        = "#0d0c0a"
fg            = "#d8ccb0"
surface       = "#26231d"
surface_hover = "#3a352b"
card          = "#1b1915"
card_alt      = "#171511"
card_hover    = "#26231d"
accent        = "#8fb8d8"
accent_hover  = "#a9c9e3"
accent2       = "#8fb8d8"
heading       = "#c9b88a"
muted         = "#9a8f78"

[terminal]
palette = ["#26231D", "#B5634F", "#8FA06A", "#C9B88A", "#6F94B4", "#A5849F", "#86AFA8", "#D8CCB0",
           "#4A4437", "#C97A63", "#A6B884", "#D8CA9F", "#8FB8D8", "#BA9DB5", "#A2C7C0", "#ECE3CF"]

# VS Code: the Anniversary Edition cover's gold on Nord's frost and snow.
[syntax]
keyword   = "#c9b98a"
function  = "#88c0d0"
type      = "#81a1c1"
tag       = "#c9b98a"
string    = "#a3be8c"
escape    = "#5e81ac"
number    = "#ebcb8b"
parameter = "#d8dee9"
property  = "#8fbcbb"

# Role names recolor VS Code only; the frame stays dark, with the cover's gold only as thin lines.
[vscode]
bg            = "#1f232b"
bg_alt        = "#1a1d24"
fg            = "#d8dee9"
surface       = "#2e3440"
surface_hover = "#3b4252"
card          = "#262b34"
card_hover    = "#2e3440"
muted         = "#616e88"
accent        = "#c9b98a"
accent_hover  = "#d8caa0"
heading       = "#b6a57a"
"titleBar.border"          = "#9d8e6c"
"statusBar.border"         = "#9d8e6c"
"statusBar.foreground"     = "#b6a57a"
"activityBar.activeBorder" = "#c9b98a"
